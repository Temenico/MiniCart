databaseChangeLog:
  - changeSet:
      id: 100-seed-products
      author: dev-team
      validCheckSum:
        - ANY
      preConditions:
        onFail: HALT
        onError: HALT
        tableExists:
          tableName: product
      changes:
        - insert:
            tableName: product
            columns:
              - column:
                  name: name
                  value: Mouse inalámbrico
              - column:
                  name: description
                  value: Mouse ergonómico inalámbrico con receptor USB
              - column:
                  name: price
                  valueNumeric: 25900
              - column:
                  name: stock
                  valueNumeric: 30
              - column:
                  name: active
                  valueBoolean: true
        - insert:
            tableName: product
            columns:
              - column:
                  name: name
                  value: Teclado mecánico
              - column:
                  name: description
                  value: Teclado mecánico compacto con switches brown
              - column:
                  name: price
                  valueNumeric: 78500
              - column:
                  name: stock
                  valueNumeric: 20
              - column:
                  name: active
                  valueBoolean: true
        - insert:
            tableName: product
            columns:
              - column:
                  name: name
                  value: Hub USB-C
              - column:
                  name: description
                  value: Hub multipuerto USB-C con HDMI y USB 3.0
              - column:
                  name: price
                  valueNumeric: 42000
              - column:
                  name: stock
                  valueNumeric: 15
              - column:
                  name: active
                  valueBoolean: true

  - changeSet:
      id: 101-normalize-seed-prices-cop
      author: dev-team
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        tableExists:
          tableName: product
      changes:
        - sql:
            sql: |
              UPDATE product
              SET price = 25900
              WHERE name = 'Mouse inalámbrico' AND price < 1000;
        - sql:
            sql: |
              UPDATE product
              SET price = 78500
              WHERE name = 'Teclado mecánico' AND price < 1000;
        - sql:
            sql: |
              UPDATE product
              SET price = 42000
              WHERE name = 'Hub USB-C' AND price < 1000;
